trigger: none

pool:
  name: "VMSS-Pool"

variables:
  # Registry
  dockerRegistryServiceConnection: "acr-connection"
  imageRepository: "audiencepulse"
  containerRegistry: "audiencepulseacrcentral.azurecr.io"
  dockerfilePath: "$(Build.SourcesDirectory)/Dockerfile"
  tag: "$(Build.BuildId)"

  # Web App
  webAppName: "audiencepulse-app-0202"
  azureSubscription: "azure-subscription"

stages:
  # -------------------------------------------------------------------------
  # STAGE 1: PARALLEL BUILD & SECURITY (Uses 2 Agents) 🚀
  # -------------------------------------------------------------------------
  - stage: BuildAndSecurity
    displayName: "Build & Security"
    jobs:
      - job: SecurityScan
        displayName: "🛡️ Security Scan"
        steps:
          - script: |
              wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
              tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
              sudo mv gitleaks /usr/local/bin/
              gitleaks detect --source . -v --report-format json --report-path gitleaks-report.json || true
            displayName: "Run Gitleaks"

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              pathToPublish: "gitleaks-report.json"
              artifactName: "security-report"

      - job: BuildImage
        displayName: "🏗️ Docker Build"
        steps:
          - task: Docker@2
            displayName: "Build & Push"
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest

  # -------------------------------------------------------------------------
  # STAGE 2: DEPLOY (Uses 1 Agent) 🚚
  # -------------------------------------------------------------------------
  - stage: Deploy
    displayName: "Deploy"
    dependsOn: BuildAndSecurity
    condition: succeeded()
    jobs:
      - deployment: WebApp
        displayName: "🚀 Deploy to Azure"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: "Azure Web App Deploy"
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(webAppName)
                    imageName: $(containerRegistry)/$(imageRepository):$(tag)
                    appSettings: "-WEBSITES_PORT 8501 -STREAMLIT_SERVER_PORT 8501 -STREAMLIT_SERVER_HEADLESS true"

  # -------------------------------------------------------------------------
  # STAGE 3: VERIFY (Uses 1 Agent) ✅
  # -------------------------------------------------------------------------
  - stage: Verify
    displayName: "Verify"
    dependsOn: Deploy
    jobs:
      - job: SmokeTest
        displayName: "🔍 Live Check"
        steps:
          - script: |
              echo "Waiting for app warm-up..."
              sleep 20
              STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" https://$(webAppName).azurewebsites.net)
              if [ "$STATUS" == "200" ]; then
                echo "✅ Success: HTTP $STATUS"
              else
                echo "⚠️ Warning: HTTP $STATUS"
              fi
            displayName: "Check HTTP 200"
