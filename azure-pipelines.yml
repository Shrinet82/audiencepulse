trigger:
  - master

pool:
  name: "VMSS-Pool"

variables:
  # Registry
  dockerRegistryServiceConnection: "acr-connection"
  imageRepository: "audiencepulse"
  containerRegistry: "audiencepulseacrcentral.azurecr.io"
  dockerfilePath: "$(Build.SourcesDirectory)/Dockerfile"
  tag: "$(Build.BuildId)"

  # Web App
  webAppName: "audiencepulse-app-0202"
  azureSubscription: "azure-subscription"

stages:
  # -------------------------------------------------------------------------
  # STAGE 1: QUALITY ASSURANCE (QA) 🧪
  # -------------------------------------------------------------------------
  - stage: QA
    displayName: "Stage 1: Quality Assurance"
    jobs:
      - job: CodeQuality
        displayName: "Code Quality & Tests"
        steps:
          - script: |
              pip install black flake8 pytest
              echo "Running Formatter Check..."
              black --check . || echo "⚠️ Formatting issues found (fix with 'black .')"

              echo "Running Linter..."
              flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

              echo "Running Unit Tests..."
              if [ ! -d "tests" ]; then mkdir tests; fi
              pytest --junitxml=test-results.xml || true
            displayName: "Run Quality Checks"

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/test-results.xml"
              failTaskOnFailedTests: true

  # -------------------------------------------------------------------------
  # STAGE 2: SECURITY GATES 🛡️
  # -------------------------------------------------------------------------
  - stage: Security
    displayName: "Stage 2: Security Gates"
    dependsOn: QA # Sequential: Waits for QA
    jobs:
      - job: SecurityScans
        displayName: "Security Scans"
        steps:
          # 1. Gitleaks
          - script: |
              wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
              tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
              sudo mv gitleaks /usr/local/bin/
              echo "Running Gitleaks..."
              gitleaks detect --source . -v --report-format json --report-path gitleaks-report.json || true
            displayName: "Run Gitleaks"

          # 2. Checkov
          - script: |
              pip install checkov
              echo "Running Checkov on K8s manifests..."
              checkov -d k8s/ --framework kubernetes -o junitxml > checkov-report.xml || true
            displayName: "Run Checkov"

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              pathToPublish: "gitleaks-report.json"
              artifactName: "security-secrets"

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "checkov-report.xml"
              testRunTitle: "Infrastructure Security"

  # -------------------------------------------------------------------------
  # STAGE 3: SECURE BUILD FACTORY 🏗️
  # -------------------------------------------------------------------------
  - stage: Build
    displayName: "Stage 3: Secure Build"
    dependsOn: Security # Sequential: Waits for Security
    jobs:
      - job: BuildAndScan
        displayName: "Build, Push & Scan"
        steps:
          # 1. Build & Push
          - task: Docker@2
            displayName: "Docker Build & Push"
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest

          # 2. Trivy Scan
          - script: |
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
              echo "Scanning Image..."
              trivy image --exit-code 0 --severity HIGH,CRITICAL --format cyclonedx --output sbom.json $(containerRegistry)/$(imageRepository):$(tag)
              trivy image --exit-code 0 --severity HIGH,CRITICAL $(containerRegistry)/$(imageRepository):$(tag)
            displayName: "Run Trivy Scan & SBOM"

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: "sbom.json"
              artifactName: "sbom-$(tag)"

  # -------------------------------------------------------------------------
  # STAGE 4: DELIVERY 🚚
  # -------------------------------------------------------------------------
  - stage: Delivery
    displayName: "Stage 4: Delivery"
    dependsOn: Build # Sequential: Waits for Build
    condition: succeeded()
    jobs:
      - deployment: WebApp
        displayName: "Deploy to Azure"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: "Azure Web App Deploy"
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(webAppName)
                    imageName: $(containerRegistry)/$(imageRepository):$(tag)
                    appSettings: "-WEBSITES_PORT 8501 -STREAMLIT_SERVER_PORT 8501 -STREAMLIT_SERVER_HEADLESS true"

  # -------------------------------------------------------------------------
  # STAGE 5: VERIFICATION ✅
  # -------------------------------------------------------------------------
  - stage: Verification
    displayName: "Stage 5: Verification"
    dependsOn: Delivery # Sequential: Waits for Delivery
    jobs:
      - job: SmokeTest
        displayName: "Live Health Check"
        steps:
          - script: |
              echo "Waiting for app warm-up..."
              sleep 20
              STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" https://$(webAppName).azurewebsites.net)
              if [ "$STATUS" == "200" ]; then
                echo "✅ Success: HTTP $STATUS"
              else
                echo "⚠️ Warning: HTTP $STATUS"
                exit 1
              fi
            displayName: "HTTP 200 Check"
