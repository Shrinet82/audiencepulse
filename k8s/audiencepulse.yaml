apiVersion: v1
kind: Secret
metadata:
  name: audiencepulse-secrets
type: Opaque
stringData:
  GROQ_API_KEY: "YOUR_GROQ_API_KEY_HERE" # Replace with actual key or use Azure Key Vault

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiencepulse
  labels:
    app: audiencepulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audiencepulse
  template:
    metadata:
      labels:
        app: audiencepulse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audiencepulse
          image: acrshrinet82prod.azurecr.io/audiencepulse:latest
          ports:
            - containerPort: 8501
              protocol: TCP
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: audiencepulse-secrets
                  key: GROQ_API_KEY
            - name: STREAMLIT_SERVER_PORT
              value: "8501"
            - name: STREAMLIT_SERVER_HEADLESS
              value: "true"
            - name: STREAMLIT_SERVER_ADDRESS
              value: "0.0.0.0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: audiencepulse
  labels:
    app: audiencepulse
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8501
      protocol: TCP
      name: http
  selector:
    app: audiencepulse

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audiencepulse-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audiencepulse
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
