name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 pytest-cov

      - name: Lint with flake8
        run: |
          # Stop on any error
          flake8 audiencepulse tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings only (exit-zero treats errors as warnings)
          flake8 audiencepulse tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests
        run: |
          pytest tests/ -v --cov=audiencepulse --cov-report=term-missing
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t audiencepulse:test .

      - name: Test Docker container starts
        run: |
          docker run -d --name test-container -p 8501:8501 audiencepulse:test
          sleep 10
          curl --retry 5 --retry-delay 2 --retry-all-errors http://localhost:8501 || exit 1
          docker stop test-container
